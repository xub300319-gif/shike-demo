<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F2F7F3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>食刻 · 暖食一刻 · 助餐服务</title>
<style>
/* ==== assets/base.css ==== */
/* ==========================================================================
   食刻 · 暖食一刻  |  base.css
   设计令牌来自《食刻App首页.psd》取色与图层量测（1125×2436 @3x → 375×812）
   ========================================================================== */

:root{
  /* —— 取色（PSD 图层实测）—— */
  --bg:        #F2F7F3;   /* 页面背景 */
  --paper:     #FFFFFF;
  --card:      #F5F8F6;   /* 餐卡 / 卡底 */
  --card-2:    #F4F7F4;   /* 订单卡 */
  --deep:      #1C6B4C;   /* 品牌深绿 */
  --green:     #27A76B;   /* 主绿 */
  --green-2:   #38956D;
  --green-3:   #34775B;
  --mint:      #DFF3E8;
  --mint-2:    #ADE2C9;
  --mint-3:    #EBFFF4;
  --ink:       #2A3A31;   /* 正文 */
  --muted:     #748278;   /* 次要 */
  --line:      #E3EDE7;
  --orange:    #FF8A3D;   /* 补贴价 */
  --red:       #E5635B;
  --amber:     #E9A23B;
  --blue:      #3C7FB0;
  --shadow:    0 6px 20px rgba(28,107,76,.07);
  --shadow-2:  0 10px 34px rgba(28,107,76,.13);

  /* —— 版式 —— */
  --pad: 20px;
  --r-sm: 10px;
  --r:    16px;
  --r-lg: 22px;
  --fs-body: 13px;

  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC",
          "Hiragino Sans GB", "Microsoft YaHei", "Source Han Sans SC",
          "Noto Sans CJK SC", system-ui, sans-serif;
  --font-num: "SF Pro Display", -apple-system, "Helvetica Neue", Arial, sans-serif;

  --nav-h: 62px;
  --zoom: 1;
}

*,*::before,*::after{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html,body{
  margin:0; padding:0; height:100%;
  background:#E8EEE9;
  font-family:var(--font);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overscroll-behavior:none;
}
body{ touch-action:manipulation; }
button{ font-family:inherit; color:inherit; border:0; background:none; padding:0; cursor:pointer; }
input,select,textarea{ font-family:inherit; font-size:inherit; color:inherit; }
a{ color:inherit; text-decoration:none; }
img{ display:block; max-width:100%; }
ul,ol{ margin:0; padding:0; list-style:none; }
h1,h2,h3,h4,p{ margin:0; }
[hidden]{ display:none !important; }
::selection{ background:var(--mint-2); }

/* ============================ 设备外框 ============================ */

.device{
  position:fixed; inset:0;
  display:flex; align-items:center; justify-content:center;
  background:
    radial-gradient(1200px 600px at 50% -10%, #F7FBF8 0%, #E8EEE9 55%, #DDE7E0 100%);
  overflow:hidden;
}
.frame{
  position:relative;
  width:100%; height:100%;
  background:var(--bg);
  overflow:hidden;
  /* 关键：transform 让内部固定/绝对定位元素以本框为参照 */
  transform:translateZ(0);
  display:flex; flex-direction:column;
}
.hint{ display:none; }

@media (min-width:600px) and (min-height:700px){
  .device{ padding:12px 12px 12px; flex-direction:column; gap:8px; }
  .frame{
    width:390px; height:min(844px, calc(100vh - 46px));
    border-radius:46px;
    box-shadow:
      0 0 0 10px #10221A,
      0 0 0 12px #2C3B33,
      0 34px 70px -18px rgba(16,34,26,.55),
      0 10px 28px rgba(16,34,26,.22);
    flex:none;
  }
  .frame::before{           /* 刘海 */
    content:""; position:absolute; z-index:60; top:9px; left:50%;
    transform:translateX(-50%);
    width:112px; height:26px; border-radius:0 0 16px 16px;
    background:#10221A;
  }
  .hint{
    display:flex; align-items:center; gap:8px;
    font-size:12px; color:#6C7C72; letter-spacing:.3px;
    user-select:none;
  }
  .hint-dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--green); box-shadow:0 0 0 4px rgba(39,167,107,.16);
    animation:pulse 2.4s ease-in-out infinite;
  }
}
@keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.35} }

/* 窗口不够高时优先保证手机屏幕完整显示：隐藏下方提示 */
@media (max-height:940px){
  .hint{ display:none !important; }
}

/* ============================ 应用容器 ============================ */

.app{
  position:relative;
  display:flex; flex-direction:column;
  width:100%; height:100%;
  background:var(--bg);
  overflow:hidden;
  font-size:calc(var(--fs-body) * var(--zoom));
}
.app.big{ --zoom:1.13; }

.screen{
  position:absolute; inset:0;
  display:flex; flex-direction:column;
  background:var(--bg);
  animation:screenIn .26s cubic-bezier(.2,.8,.3,1) both;
}
.screen.back-anim{ animation:screenBack .24s cubic-bezier(.2,.8,.3,1) both; }
@keyframes screenIn{ from{ opacity:0; transform:translateX(16px) } to{ opacity:1; transform:none } }
@keyframes screenBack{ from{ opacity:0; transform:translateX(-14px) } to{ opacity:1; transform:none } }

.body{
  flex:1 1 auto; min-height:0;
  overflow-y:auto; overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.body::-webkit-scrollbar{ width:0; height:0; }

.safe-b{ padding-bottom:8px; }

/* ============================ 状态栏 ============================ */

.statusbar{
  flex:none; height:40px;
  display:flex; align-items:flex-end; justify-content:space-between;
  padding:0 22px 6px; font-size:14px; font-weight:600;
  color:var(--ink); letter-spacing:.2px;
  position:relative; z-index:5;
}
.statusbar .sb-clock{ font-family:var(--font-num); font-variant-numeric:tabular-nums; }
.statusbar .sb-right{ display:flex; align-items:center; gap:5px; }
.statusbar svg{ display:block; }
.sb-batt{ width:22px; height:11px; position:relative; }
.sb-batt i{
  position:absolute; inset:0; border:1.4px solid currentColor; border-radius:2.6px;
  opacity:.45;
}
.sb-batt i::after{ content:""; position:absolute; right:-3.2px; top:3px; width:1.8px; height:5px; border-radius:0 1px 1px 0; background:currentColor; }
.sb-batt b{ position:absolute; left:1.6px; top:1.6px; bottom:1.6px; width:13px; border-radius:1.2px; background:var(--green); display:block; }

@media (min-width:600px) and (min-height:700px){
  .statusbar{ height:52px; padding:0 26px 4px; }
}

/* ============================ 顶部栏（子页） ============================ */

.topbar{
  flex:none;
  display:flex; align-items:center; gap:10px;
  padding:2px var(--pad) 10px;
  min-height:44px;
  background:var(--bg);
  position:sticky; top:0; z-index:12;
}
.topbar .tb-title{
  font-size:16px; font-weight:700; letter-spacing:.3px; color:var(--ink);
  flex:1; text-align:center; padding-right:0;
}
.topbar .tb-title.no-back{ padding-right:0; text-align:left; }

/* 返回上一级：带文字的胶囊，老人一眼能认出来 */
.backpill{
  display:inline-flex; align-items:center; gap:1px;
  height:32px; padding:0 11px 0 5px; flex:none;
  border-radius:16px;
  background:rgba(28,107,76,.085);
  color:var(--deep);
  font-size:12px; font-weight:700; letter-spacing:.4px;
  transition:transform .12s ease, background .16s;
}
.backpill:active{ transform:scale(.95); background:rgba(28,107,76,.16); }
.backpill svg{ display:block; }
.back-spacer{ width:64px; flex:none; }
.iconbtn{
  width:32px; height:32px; flex:none;
  display:grid; place-items:center;
  border-radius:50%;
  color:var(--deep);
  background:transparent;
  transition:background .16s;
}
.iconbtn:active{ background:rgba(28,107,76,.08); }
.iconbtn svg{ display:block; }

/* ============================ 品牌头 ============================ */

.brandrow{
  display:flex; align-items:center;
  padding:2px var(--pad) 0;
  height:44px;
}
.wordmark{
  font-size:25px; line-height:1;
  font-weight:900; letter-spacing:1px;
  color:var(--deep);
  position:relative;
}
.brand-tag{
  font-size:11px; color:var(--muted); letter-spacing:1.4px;
  margin-left:14px; margin-top:5px;
}
.brandrow .grow{ flex:1; }
.bell{
  position:relative; width:34px; height:34px; border-radius:50%;
  background:var(--mint);
  display:grid; place-items:center;
  color:var(--deep);
}
.bell .dot{
  position:absolute; top:-1px; right:-1px;
  width:9px; height:9px; border-radius:50%;
  background:var(--red);
  box-shadow:0 0 0 2px var(--bg);
}
.bell-bar{
  position:absolute; left:-4px; right:-4px; bottom:-7px; height:3px;
  border-radius:2px; background:var(--green-2); opacity:.85;
}

/* ============================ 通用元件 ============================ */

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  height:44px; padding:0 20px;
  border-radius:14px;
  background:var(--green); color:#fff;
  font-size:14px; font-weight:700; letter-spacing:.4px;
  transition:transform .12s ease, filter .16s ease, box-shadow .16s;
  box-shadow:0 6px 16px -6px rgba(39,167,107,.7);
}
.btn:active{ transform:scale(.975); filter:brightness(.96); }
.btn.block{ display:flex; width:100%; }
.btn.ghost{
  background:transparent; color:var(--deep);
  box-shadow:none; border:1.4px solid rgba(28,107,76,.22);
}
.btn.soft{ background:var(--mint); color:var(--deep); box-shadow:none; }
.btn.ghost:active{ background:rgba(28,107,76,.06); }
.btn.sm{ height:34px; padding:0 14px; font-size:12.5px; border-radius:11px; }
.btn:disabled{ opacity:.42; filter:grayscale(.3); box-shadow:none; pointer-events:none; }
.btn .arw{ opacity:.75; }

.card{
  background:var(--paper);
  border-radius:var(--r);
  box-shadow:var(--shadow);
}
.card.pad{ padding:16px; }

.sec-title{
  display:flex; align-items:baseline; justify-content:space-between;
  padding:0 var(--pad);
  margin:12px 0 8px;
}
.sec-title h2{
  font-size:15px; font-weight:800; letter-spacing:.6px; color:var(--ink); line-height:1.15;
}
.sec-title .more{
  font-size:11px; color:var(--muted); display:flex; align-items:center; gap:3px;
}
.sec-title .more:active{ color:var(--deep); }

.chip{
  display:inline-flex; align-items:center; gap:5px;
  height:24px; padding:0 10px; border-radius:8px;
  background:var(--mint); color:var(--deep);
  font-size:11px; font-weight:600; letter-spacing:.3px;
  white-space:nowrap;
}
.chip.line{ background:transparent; border:1px solid rgba(28,107,76,.2); }
.chip.orange{ background:rgba(255,138,61,.13); color:#C2601F; }
.chip.grey{ background:#EEF3EF; color:var(--muted); }
.chip.red{ background:rgba(229,99,91,.13); color:#B8403A; }
.chip.blue{ background:rgba(60,127,176,.12); color:#2C6491; }

.dot-sep{ color:var(--muted); opacity:.55; margin:0 6px; }

.tiny{ font-size:10.5px; color:var(--muted); letter-spacing:.2px; }
.num{ font-family:var(--font-num); font-variant-numeric:tabular-nums; }
.money{ font-family:var(--font-num); font-variant-numeric:tabular-nums; font-weight:800; }
.money .u{ font-size:.72em; margin-right:1px; font-weight:700; }
.price-now{ color:var(--orange); }
.price-old{ color:var(--muted); text-decoration:line-through; font-size:11px; }

.rowline{ height:1px; background:var(--line); margin:14px 0; border:0; }

.empty{
  padding:60px 20px; text-align:center; color:var(--muted); font-size:12.5px;
}
.empty .e-ico{ font-size:34px; opacity:.5; margin-bottom:10px; }

/* 骨架/加载 */
.spinner{
  width:18px; height:18px; border-radius:50%;
  border:2px solid rgba(255,255,255,.4); border-top-color:#fff;
  animation:spin .7s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg) } }

/* ============================ 底部导航 ============================ */

.tabbar{
  flex:none; height:var(--nav-h);
  background:#fff;
  border-top:1px solid rgba(28,107,76,.07);
  display:grid; grid-template-columns:repeat(4,1fr);
  padding-bottom:env(safe-area-inset-bottom,0);
  z-index:20;
}
.tabbar .tab{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  color:var(--muted); position:relative;
  padding-top:2px;
}
.tabbar .tab .tlabel{ font-size:11px; letter-spacing:.6px; }
.tabbar .tab svg{ display:block; }
.tabbar .tab.on{ color:var(--deep); font-weight:700; }
.tabbar .tab.on .tlabel{ font-weight:700; }
.tabbar .tab .badge{
  position:absolute; top:6px; left:calc(50% + 6px);
  min-width:15px; height:15px; padding:0 4px;
  border-radius:8px; background:var(--red); color:#fff;
  font-size:9.5px; font-weight:700; line-height:15px; text-align:center;
  font-family:var(--font-num);
}

/* ============================ 浮层 ============================ */

.sheet-wrap{
  position:absolute; inset:0; z-index:80;
  display:flex; flex-direction:column; justify-content:flex-end;
  background:rgba(18,38,29,.34);
  backdrop-filter:blur(2px);
  animation:fadeIn .2s ease both;
}
@keyframes fadeIn{ from{opacity:0} to{opacity:1} }
.sheet{
  background:var(--paper);
  border-radius:24px 24px 0 0;
  max-height:86%;
  display:flex; flex-direction:column;
  animation:sheetUp .3s cubic-bezier(.2,.85,.3,1) both;
  box-shadow:0 -12px 40px rgba(16,34,26,.18);
}
@keyframes sheetUp{ from{ transform:translateY(100%) } to{ transform:none } }
.sheet-head{
  flex:none; display:flex; align-items:center; gap:8px;
  padding:16px 20px 10px;
}
.sheet-head h3{ font-size:15px; font-weight:800; flex:1; letter-spacing:.4px; }
.sheet-head .x{ width:28px; height:28px; display:grid; place-items:center; border-radius:50%; color:var(--muted); background:#F1F5F2; }
.sheet-body{ padding:2px 20px 12px; overflow-y:auto; }
.sheet-foot{ padding:10px 20px calc(16px + env(safe-area-inset-bottom,0)); border-top:1px solid var(--line); background:#fff; }

.modal-wrap{
  position:absolute; inset:0; z-index:90;
  display:grid; place-items:center; padding:26px;
  background:rgba(18,38,29,.4);
  animation:fadeIn .18s ease both;
}
.modal{
  width:100%; background:#fff; border-radius:20px; padding:20px;
  box-shadow:var(--shadow-2);
  animation:pop .24s cubic-bezier(.2,.9,.3,1) both;
}
@keyframes pop{ from{ transform:scale(.94); opacity:0 } to{ transform:none; opacity:1 } }
.modal h3{ font-size:15.5px; font-weight:800; margin-bottom:8px; }
.modal p{ font-size:12.5px; color:var(--muted); line-height:1.75; }
.modal .m-actions{ display:flex; gap:10px; margin-top:18px; }
.modal .m-actions .btn{ flex:1; height:42px; font-size:13.5px; }

.toast{
  position:absolute; left:50%; bottom:96px; transform:translateX(-50%);
  background:rgba(22,42,32,.93); color:#fff;
  padding:10px 16px; border-radius:12px;
  font-size:12.5px; letter-spacing:.3px; line-height:1.5;
  max-width:78%; text-align:center;
  z-index:120; pointer-events:none;
  animation:toastIn .24s cubic-bezier(.2,.9,.3,1) both;
  box-shadow:0 10px 26px rgba(0,0,0,.22);
  display:flex; align-items:center; gap:8px;
}
.toast.out{ animation:toastOut .26s ease both; }
@keyframes toastIn{ from{ opacity:0; transform:translate(-50%,10px) } to{ opacity:1; transform:translate(-50%,0) } }
@keyframes toastOut{ to{ opacity:0; transform:translate(-50%,8px) } }
.toast .t-ico{ width:16px; height:16px; flex:none; }

/* ============================ 启动画面 ============================ */

.splash{
  position:fixed; inset:0; z-index:999;
  display:grid; place-items:center;
  background:
    radial-gradient(80% 60% at 50% 22%, #2FAE72 0%, #27A76B 42%, #1C6B4C 100%);
  transition:opacity .5s ease, visibility .5s;
}
.splash.gone{ opacity:0; visibility:hidden; }
.splash-inner{ text-align:center; color:#fff; transform:translateY(-6px); }
.splash-logo{
  font-size:62px; font-weight:900; letter-spacing:6px; line-height:1;
  text-shadow:0 12px 30px rgba(0,0,0,.16);
  animation:splashIn .8s cubic-bezier(.16,.9,.3,1) both;
}
.splash-tag{
  margin-top:16px; font-size:13px; letter-spacing:5px; opacity:.92;
  animation:splashIn .8s .1s cubic-bezier(.16,.9,.3,1) both;
}
.splash-line{
  width:44px; height:2px; border-radius:2px; background:rgba(255,255,255,.55);
  margin:22px auto;
  animation:splashIn .8s .18s cubic-bezier(.16,.9,.3,1) both;
}
.splash-sub{
  font-size:11.5px; letter-spacing:3px; opacity:.72;
  animation:splashIn .8s .26s cubic-bezier(.16,.9,.3,1) both;
}
.splash-load{
  width:120px; height:2px; border-radius:2px; background:rgba(255,255,255,.22);
  margin:34px auto 0; overflow:hidden;
}
.splash-load i{
  display:block; width:40%; height:100%; border-radius:2px; background:#fff;
  animation:loadbar 1.15s cubic-bezier(.5,0,.3,1) infinite;
}
@keyframes loadbar{ 0%{ transform:translateX(-100%) } 100%{ transform:translateX(280%) } }
@keyframes splashIn{ from{ opacity:0; transform:translateY(14px) } to{ opacity:1; transform:none } }

/* ============================ 装饰形状 ============================ */

.blob-btn{ position:relative; display:inline-grid; place-items:center; }
.blob-btn .bshape{ position:absolute; inset:0; }
.blob-btn .btxt{
  position:relative; z-index:2;
  font-size:12px; font-weight:700; letter-spacing:1px; color:#08231A;
}
.blob-btn:active .bshape{ filter:brightness(.93); }

.wave-band{ position:relative; overflow:hidden; }
.wave-band svg{ position:absolute; inset:0; width:100%; height:100%; }

/* 滚动条隐藏 */
.no-sb{ scrollbar-width:none; }
.no-sb::-webkit-scrollbar{ display:none; }

/* 通用文字 */
.h1{ font-size:20px; font-weight:800; letter-spacing:.5px; }
.h2{ font-size:16px; font-weight:800; letter-spacing:.4px; }
.h3{ font-size:14px; font-weight:700; letter-spacing:.3px; }
.p{ font-size:12.5px; line-height:1.85; color:var(--ink); }
.muted{ color:var(--muted); }
.wht{ color:#fff; }
.center{ text-align:center; }
.mt8{ margin-top:8px } .mt12{ margin-top:12px } .mt16{ margin-top:16px } .mt20{ margin-top:20px }
.mb8{ margin-bottom:8px } .mb12{ margin-bottom:12px }
.flex{ display:flex } .aic{ align-items:center } .jcb{ justify-content:space-between } .gap6{ gap:6px } .gap8{ gap:8px } .gap10{ gap:10px } .gap12{ gap:12px }
.grow{ flex:1 }

/* 表单 */
.field{ margin-bottom:14px; }
.field > label{
  display:block; font-size:12px; font-weight:700; color:var(--ink);
  margin-bottom:7px; letter-spacing:.4px;
}
.field .hintline{ font-size:10.5px; color:var(--muted); margin-top:6px; line-height:1.6; }
.input{
  width:100%; height:42px; padding:0 13px;
  border-radius:12px; border:1.4px solid var(--line);
  background:#fff; font-size:13px; color:var(--ink);
  transition:border-color .16s, box-shadow .16s;
}
.input:focus{ outline:none; border-color:var(--green); box-shadow:0 0 0 3px rgba(39,167,107,.13); }
textarea.input{ height:auto; padding:11px 13px; line-height:1.7; resize:none; }

.seg{
  display:flex; gap:6px; background:#EDF3EE; padding:3px; border-radius:11px;
}
.seg button{
  flex:1; height:30px; border-radius:8px; font-size:11.5px; font-weight:600; color:var(--muted);
  transition:all .18s;
}
.seg button.on{ background:#fff; color:var(--deep); box-shadow:0 2px 6px rgba(28,107,76,.1); font-weight:700; }

.opt-row{ display:flex; flex-wrap:wrap; gap:7px; }
.opt{
  height:32px; padding:0 13px; border-radius:10px;
  border:1.4px solid var(--line); background:#fff;
  font-size:12px; color:var(--ink); font-weight:500;
  display:inline-flex; align-items:center; gap:5px;
  transition:all .16s;
}
.opt.on{
  border-color:var(--green); background:rgba(39,167,107,.08);
  color:var(--deep); font-weight:700;
}
.opt.on::before{ content:"✓"; font-size:11px; }

.switch{
  width:38px; height:22px; border-radius:11px; background:#DDE6E0; position:relative;
  transition:background .2s; flex:none;
}
.switch::after{
  content:""; position:absolute; top:2px; left:2px; width:18px; height:18px;

.ps .ps-dot{ width:8px; height:8px; border-radius:50%; background:#DDE8E1; margin:0 auto 5px; }
.ps.done .ps-dot{ background:var(--green); }
.ps .ps-l{ font-size:9.5px; color:var(--muted); letter-spacing:.2px; }
.ps.done .ps-l{ color:var(--deep); font-weight:700; }
.ps::before{
  content:""; position:absolute; top:3.5px; left:-50%; width:100%; height:1.5px; background:#E3EDE7;
}
.ps:first-child::before{ display:none; }
.ps.done::before{ background:var(--green-2); opacity:.5; }

/* 回访卡 */
.visit{
  border-radius:14px; padding:13px 14px;
  background:linear-gradient(150deg,rgba(223,243,232,.72),rgba(246,251,247,.9));
  border:1px dashed rgba(28,107,76,.22);
}
.visit .v-head{ display:flex; align-items:center; gap:7px; font-size:12px; font-weight:800; color:var(--deep); }
.visit .v-body{ margin-top:9px; font-size:11px; line-height:1.8; color:#3E5A4C; }
.visit .v-grid{ display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-top:10px; }
.visit .vg{ background:#fff; border-radius:9px; padding:7px 9px; }
.visit .vg .k{ font-size:9.5px; color:var(--muted); letter-spacing:.3px; }
.visit .vg .v{ font-size:11.5px; font-weight:700; margin-top:2px; }

/* ============================ 自费自选 ============================ */

.self-banner{
  margin:0 var(--pad); border-radius:16px; padding:14px 15px;
  background:linear-gradient(140deg,#FFF3E9,#FDE7D6);
  display:flex; align-items:center; gap:12px;
  border:1px solid rgba(255,138,61,.14);
}
.self-banner .sb-ico{ font-size:20px; }
.self-banner .sb-t{ font-size:12.5px; font-weight:800; color:#9C4E16; }
.self-banner .sb-s{ font-size:10.5px; color:#A96833; margin-top:3px; line-height:1.6; }

.rest{
  background:#fff; border-radius:15px; padding:13px 14px; margin-bottom:10px;
  box-shadow:0 3px 14px rgba(28,107,76,.05);
}
.rest-h{ display:flex; align-items:center; gap:8px; }
.rest-h .rh-logo{
  width:32px; height:32px; border-radius:9px; background:linear-gradient(150deg,#E7F5EC,#D2ECDF);
  display:grid; place-items:center; font-size:14px; flex:none;
}
.rest-h .rh-main{ flex:1; min-width:0; }
.rest-h .rh-name{ font-size:12.5px; font-weight:800; display:flex; align-items:center; gap:6px; }
.rest-h .rh-sub{ font-size:10px; color:var(--muted); margin-top:2px; }
.dish{
  display:flex; align-items:center; gap:10px; padding:10px 0;
  border-bottom:1px dashed rgba(28,107,76,.1);
}
.dish:last-child{ border-bottom:0; padding-bottom:2px; }
.dish .d-main{ flex:1; min-width:0; }
.dish .d-name{ font-size:12.5px; font-weight:600; }
.dish .d-desc{ font-size:10px; color:var(--muted); margin-top:3px; }
.dish .d-price{ font-family:var(--font-num); font-size:13px; font-weight:800; color:#9C4E16; margin-right:2px; }
.addbtn{
  width:24px; height:24px; border-radius:50%; background:var(--green); color:#fff;
  display:grid; place-items:center; font-size:15px; line-height:1; flex:none;
  box-shadow:0 3px 8px -2px rgba(39,167,107,.7);
}
.addbtn:active{ transform:scale(.9); }
.qtybox{ display:flex; align-items:center; gap:8px; }
.qtybox button{ width:22px; height:22px; border-radius:50%; background:var(--mint); color:var(--deep); font-size:13px; display:grid; place-items:center; line-height:1; }
.qtybox .q{ font-family:var(--font-num); font-size:12px; font-weight:700; min-width:12px; text-align:center; }

.cart-fab{
  position:absolute; left:var(--pad); right:var(--pad); bottom:calc(12px + env(safe-area-inset-bottom,0));
  height:50px; border-radius:15px; background:var(--deep); color:#fff;
  display:flex; align-items:center; gap:10px; padding:0 8px 0 16px;
  box-shadow:0 12px 28px -8px rgba(16,60,42,.55);
  z-index:30;
  animation:sheetUp .3s cubic-bezier(.2,.85,.3,1) both;
}
.cart-fab .cf-l{ flex:1; }
.cart-fab .cf-n{ font-size:11.5px; font-weight:700; }
.cart-fab .cf-s{ font-size:9.5px; opacity:.65; margin-top:2px; }
.cart-fab .cf-btn{
  height:38px; padding:0 16px; border-radius:11px; background:var(--green);
  font-size:12.5px; font-weight:700; display:grid; place-items:center; letter-spacing:.4px;
}
.cart-fab .cf-amt{ font-family:var(--font-num); font-size:16px; font-weight:800; }

/* ============================ 补贴明细 ============================ */

.sub-hero{
  margin:0 var(--pad); border-radius:20px; padding:18px; position:relative; overflow:hidden;
  background:linear-gradient(150deg,#1F7A57,#1C6B4C 60%,#15543B);
  color:#fff;
}
.sub-hero::after{
  content:""; position:absolute; right:-30px; bottom:-50px; width:130px; height:130px;
  border-radius:50%; background:rgba(255,255,255,.07);
}
.sub-hero .sh-l{ font-size:10.5px; opacity:.8; letter-spacing:1.2px; }
.sub-hero .sh-amt{ font-family:var(--font-num); font-size:34px; font-weight:800; margin-top:6px; letter-spacing:-.5px; }
.sub-hero .sh-amt small{ font-size:14px; font-weight:600; opacity:.7; margin-left:3px; }
.sub-hero .sh-bar{ margin-top:14px; height:5px; border-radius:3px; background:rgba(255,255,255,.18); overflow:hidden; }
.sub-hero .sh-bar i{ display:block; height:100%; border-radius:3px; background:#8FE3BC; transition:width .7s; }
.sub-hero .sh-foot{ display:flex; justify-content:space-between; margin-top:9px; font-size:10px; opacity:.82; position:relative; z-index:2; }

.tier{ display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px dashed rgba(28,107,76,.1); }
.tier:last-child{ border-bottom:0; }
.tier .t-main{ flex:1; }
.tier .t-name{ font-size:12px; font-weight:700; display:flex; align-items:center; gap:6px; }
.tier .t-cond{ font-size:10px; color:var(--muted); margin-top:3px; }
.tier .t-val{ text-align:right; font-family:var(--font-num); font-size:12.5px; font-weight:800; color:var(--deep); }
.tier .t-val small{ display:block; font-family:var(--font); font-size:9px; color:var(--muted); font-weight:500; }
.tier.me{ background:rgba(39,167,107,.055); border-radius:10px; padding:11px 10px; margin:0 -10px; }

.ledger-item{ display:flex; gap:11px; padding:12px 0; border-bottom:1px solid var(--line); }
.ledger-item:last-child{ border-bottom:0; }
.li-ico{
  width:32px; height:32px; border-radius:10px; flex:none; display:grid; place-items:center;
  background:var(--mint); color:var(--deep); font-size:13px; font-weight:800;
}
.li-ico.out{ background:rgba(255,138,61,.13); color:#C2601F; }
.li-main{ flex:1; min-width:0; }
.li-t{ font-size:12px; font-weight:700; display:flex; align-items:center; gap:6px; }
.li-s{ font-size:10px; color:var(--muted); margin-top:4px; line-height:1.55; }
.li-v{ text-align:right; font-family:var(--font-num); font-size:13px; font-weight:800; color:var(--green); }
.li-v.out{ color:var(--orange); }

/* ============================ 订单列表 ============================ */

.tabs{
  display:flex; gap:4px; padding:0 var(--pad) 2px; overflow-x:auto;
}
.tabs::-webkit-scrollbar{ display:none; }
.tabs button{
  height:28px; padding:0 13px; border-radius:9px; font-size:11.5px; color:var(--muted);
  white-space:nowrap; font-weight:600;
}
.tabs button.on{ background:var(--deep); color:#fff; font-weight:700; }

.ord{
  background:#fff; border-radius:15px; padding:12px 13px; margin:0 var(--pad) 9px;
  box-shadow:0 3px 14px rgba(28,107,76,.05);
  transition:transform .12s;
}
.ord:active{ transform:scale(.995); }
.ord-h{ display:flex; align-items:center; gap:7px; }
.ord-h .o-id{ font-size:10px; color:var(--muted); font-family:var(--font-num); letter-spacing:.3px; flex:1; }
.ord-h .o-st{ font-size:10.5px; font-weight:700; }
.ord-b{ display:flex; gap:10px; margin-top:9px; align-items:flex-start; }
.ord-b .o-main{ flex:1; min-width:0; }
.ord-b .o-name{ font-size:13px; font-weight:700; line-height:1.35; }
.ord-b .o-meta{ font-size:10px; color:var(--muted); margin-top:4px; }
.ord-b .o-amt{ text-align:right; }
.ord-b .o-amt .money{ font-size:15px; color:var(--ink); }
.ord-b .o-amt .o-save{ font-size:9.5px; color:var(--green); margin-top:2px; }
.ord-f{ display:flex; gap:8px; margin-top:9px; padding-top:9px; border-top:1px solid var(--line); }
.ord-f .grow{ flex:1; }
.ord-f .btn{ height:32px; font-size:11.5px; padding:0 13px; border-radius:10px; }

/* ============================ 消息 ============================ */

.msg{
  display:flex; gap:11px; padding:13px 14px; background:#fff; border-radius:14px;
  margin:0 var(--pad) 9px; box-shadow:0 3px 12px rgba(28,107,76,.045);
  position:relative;
}
.msg.unread::after{
  content:""; position:absolute; right:12px; top:14px; width:6px; height:6px;
  border-radius:50%; background:var(--red);
}
.msg .m-ico{
  width:34px; height:34px; border-radius:11px; flex:none; display:grid; place-items:center;
  font-size:15px; background:var(--mint);
}
.msg .m-ico.orange{ background:rgba(255,138,61,.14); }
.msg .m-ico.blue{ background:rgba(60,127,176,.12); }
.msg .m-ico.red{ background:rgba(229,99,91,.12); }
.msg .m-main{ flex:1; min-width:0; }
.msg .m-t{ font-size:12.5px; font-weight:700; padding-right:16px; }
.msg .m-b{ font-size:10.5px; color:var(--muted); margin-top:4px; line-height:1.65; }
.msg .m-time{ font-size:9.5px; color:#A6B3AB; margin-top:6px; font-family:var(--font-num); }

/* ============================ 我的 ============================ */

.profile-hero{
  margin:0 var(--pad); border-radius:20px; padding:18px;
  background:linear-gradient(155deg,#FFFFFF,#F4FAF6);
  box-shadow:0 6px 22px rgba(28,107,76,.07);
  position:relative; overflow:hidden;
}
.profile-hero::after{
  content:""; position:absolute; right:-34px; top:-34px; width:110px; height:110px;
  border-radius:50%; background:rgba(173,226,201,.24);
}
.ph-row{ display:flex; align-items:center; gap:13px; position:relative; z-index:2; }
.ph-avatar{
  width:52px; height:52px; border-radius:50%; flex:none;
  background:linear-gradient(150deg,#DFF3E8,#BFE6D3);
  display:grid; place-items:center; font-size:19px; font-weight:800; color:var(--deep);
}
.ph-name{ font-size:16.5px; font-weight:800; letter-spacing:.3px; display:flex; align-items:center; gap:7px; }
.ph-sub{ font-size:10.5px; color:var(--muted); margin-top:5px; letter-spacing:.2px; }
.ph-tags{ display:flex; gap:5px; margin-top:9px; flex-wrap:wrap; position:relative; z-index:2; }
.ph-stats{
  display:grid; grid-template-columns:repeat(3,1fr); margin-top:15px;
  padding-top:14px; border-top:1px solid rgba(28,107,76,.08);
  position:relative; z-index:2;
}
.ph-stats .st{ text-align:center; }
.ph-stats .st .v{ font-family:var(--font-num); font-size:17px; font-weight:800; color:var(--deep); }
.ph-stats .st .k{ font-size:9.5px; color:var(--muted); margin-top:3px; letter-spacing:.3px; }

.menu-list{ background:#fff; border-radius:16px; margin:0 var(--pad); overflow:hidden; box-shadow:0 3px 14px rgba(28,107,76,.05); }
.mi{
  display:flex; align-items:center; gap:11px; padding:14px 15px;
  border-bottom:1px solid var(--line);
  width:100%; text-align:left;
}
.mi:last-child{ border-bottom:0; }
.mi:active{ background:#F7FBF8; }
.mi .mi-ico{ width:28px; height:28px; border-radius:9px; background:var(--mint); display:grid; place-items:center; font-size:13px; flex:none; }
.mi .mi-l{ flex:1; font-size:12.5px; font-weight:600; }
.mi .mi-l small{ display:block; font-size:10px; color:var(--muted); font-weight:400; margin-top:3px; }
.mi .mi-r{ font-size:11px; color:var(--muted); }

/* ============================ 网格员代登记 ============================ */

.grid-head{
  margin:0 var(--pad); border-radius:16px; padding:14px 15px;
  background:linear-gradient(145deg,#F0F8F3,#E2F2E9);
  border:1px solid rgba(28,107,76,.1);
}
.grid-head .gh-t{ font-size:12.5px; font-weight:800; color:var(--deep); display:flex; align-items:center; gap:7px; }
.grid-head .gh-s{ font-size:10.5px; color:#4E6F5D; margin-top:6px; line-height:1.7; }

.elder{
  display:flex; align-items:center; gap:11px;
  padding:12px 13px; border-radius:13px; background:#fff; margin-bottom:8px;
  box-shadow:0 2px 10px rgba(28,107,76,.045);
  transition:all .16s; border:1.4px solid transparent;
}
.elder.on{ border-color:var(--green); background:rgba(39,167,107,.045); }
.elder .e-av{
  width:34px; height:34px; border-radius:50%; flex:none; display:grid; place-items:center;
  background:var(--mint); color:var(--deep); font-size:13px; font-weight:800;
}
.elder .e-main{ flex:1; min-width:0; }
.elder .e-name{ font-size:12.5px; font-weight:700; display:flex; align-items:center; gap:6px; }
.elder .e-meta{ font-size:10px; color:var(--muted); margin-top:3px; }
.elder .e-box{
  width:19px; height:19px; border-radius:6px; border:1.6px solid #CBD9D0; flex:none;
  display:grid; place-items:center; font-size:11px; color:#fff;
}
.elder.on .e-box{ background:var(--green); border-color:var(--green); }

.voice{
  display:flex; flex-direction:column; align-items:center; gap:10px;
  padding:18px 14px; border-radius:16px; background:#fff;
  box-shadow:0 3px 14px rgba(28,107,76,.05);
}
.voice .v-btn{
  width:64px; height:64px; border-radius:50%; background:var(--green); color:#fff;
  display:grid; place-items:center;
  box-shadow:0 8px 22px -6px rgba(39,167,107,.8);
  position:relative;
}
.voice .v-btn.rec{ animation:recPulse 1.4s infinite; }
@keyframes recPulse{ 0%{ box-shadow:0 0 0 0 rgba(39,167,107,.5) } 100%{ box-shadow:0 0 0 22px rgba(39,167,107,0) } }
.voice .v-t{ font-size:11.5px; color:var(--muted); text-align:center; line-height:1.6; }
.voice .v-res{
  width:100%; background:#F5FAF7; border-radius:11px; padding:11px 12px;
  font-size:11.5px; line-height:1.75; color:var(--ink); min-height:44px;
}
.voice .v-res .vw{ color:var(--deep); font-weight:700; }
.voice .v-res .blink{ display:inline-block; width:1px; height:12px; background:var(--green); vertical-align:-2px; animation:blink .8s steps(1) infinite; }
@keyframes blink{ 50%{ opacity:0 } }

.voucher{
  background:#fff; border-radius:18px; padding:18px 16px;
  box-shadow:0 8px 30px rgba(28,107,76,.1);
  position:relative; overflow:hidden;
  border-top:5px solid var(--green);
}
.voucher::after{
  content:""; position:absolute; left:0; right:0; bottom:0; height:34px;
  background:repeating-linear-gradient(45deg, rgba(39,167,107,.05) 0 6px, transparent 6px 12px);
  pointer-events:none;
}
.vc-head{ display:flex; align-items:center; gap:8px; }
.vc-head .vh-t{ font-size:13px; font-weight:800; letter-spacing:1.2px; color:var(--deep); flex:1; }
.vc-head .vh-n{ font-size:9.5px; color:var(--muted); font-family:var(--font-num); letter-spacing:.4px; }
.vc-line{ height:1px; background:repeating-linear-gradient(90deg,#D9E6DD 0 5px,transparent 5px 10px); margin:12px 0; }
.vc-row{ display:flex; justify-content:space-between; gap:10px; padding:5px 0; font-size:11.5px; }
.vc-row .k{ color:var(--muted); }
.vc-row .v{ font-weight:700; text-align:right; }
.vc-qr{ display:flex; align-items:center; gap:14px; margin-top:12px; }
.vc-qr img{ width:82px; height:82px; border-radius:8px; background:#fff; }
.vc-qr .qr-t{ font-size:10.5px; color:var(--muted); line-height:1.75; }
.vc-sign{ margin-top:14px; display:flex; align-items:center; gap:10px; }
.vc-sign .sig-box{
  flex:1; height:56px; border-radius:10px; border:1.4px dashed rgba(28,107,76,.28);
  display:grid; place-items:center; font-size:10.5px; color:#A6B3AB;
  position:relative; overflow:hidden; background:#FCFEFD;
}
.vc-sign .sig-box canvas{ position:absolute; inset:0; width:100%; height:100%; touch-action:none; }
.sig-hint{ font-size:10px; color:var(--muted); }

/* ============================ 调度中枢 ============================ */

.ops{ background:#F6F8F7; }
.ops-top{
  flex:none; padding:12px var(--pad) 10px;
  background:linear-gradient(160deg,#183A2B,#123026);
  color:#fff;
}
.ops-top .ot-row{ display:flex; align-items:center; gap:9px; }
.ops-top .ot-brand{ font-size:14px; font-weight:800; letter-spacing:1.6px; }
.ops-top .ot-sub{ font-size:9.5px; opacity:.62; letter-spacing:.4px; margin-top:2px; }
.ops-top .ot-tag{
  font-size:9px; padding:3px 7px; border-radius:5px; background:rgba(255,255,255,.12);
  letter-spacing:.4px; border:1px solid rgba(255,255,255,.14);
}
.ops-top .ot-live{
  margin-left:auto; display:flex; align-items:center; gap:5px;
  font-size:9.5px; opacity:.9;
}
.ops-top .ot-live i{ width:5px; height:5px; border-radius:50%; background:#5BE09A; animation:pulse 1.6s infinite; }

.kpis{ display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-top:12px; }
.kpi{
  background:rgba(255,255,255,.075); border-radius:11px; padding:9px 10px;
  border:1px solid rgba(255,255,255,.07);
}
.kpi .k-v{ font-family:var(--font-num); font-size:18px; font-weight:800; letter-spacing:-.3px; line-height:1.1; }
.kpi .k-v small{ font-size:9px; font-weight:600; opacity:.6; margin-left:2px; }
.kpi .k-k{ font-size:9px; opacity:.6; margin-top:4px; letter-spacing:.3px; }
.kpi.warn .k-v{ color:#FFC57A; }
.kpi.good .k-v{ color:#6FE0A6; }

.ops-body{ flex:1; overflow-y:auto; padding-bottom:16px; }
.ops-sec{ margin:12px var(--pad) 0; }
.ops-sec > h4{
  font-size:11px; font-weight:800; letter-spacing:.6px; color:#516259;
  display:flex; align-items:center; gap:6px; margin-bottom:8px;
}
.ops-sec > h4 .n{ font-family:var(--font-num); color:var(--green); }
.ops-sec > h4 .r{ margin-left:auto; font-weight:500; font-size:9.5px; color:#8C9A92; }

.ocard{
  background:#fff; border-radius:13px; padding:12px 13px;
  box-shadow:0 2px 10px rgba(28,107,76,.05);
  border:1px solid rgba(28,107,76,.05);
}
.ai-card{
  background:linear-gradient(155deg,#F2FBF6,#E6F6EE);
  border:1px solid rgba(39,167,107,.22);
  border-radius:15px; padding:13px 14px; position:relative; overflow:hidden;
}
.ai-card::before{
  content:"AI"; position:absolute; right:12px; bottom:8px;
  font-family:var(--font-num); font-size:36px; font-weight:800; color:rgba(39,167,107,.09);
  letter-spacing:-2px; pointer-events:none;
}
.ai-h{ display:flex; align-items:center; gap:7px; font-size:11.5px; font-weight:800; color:var(--deep); }
.ai-h .ai-dot{
  width:16px; height:16px; border-radius:5px; background:var(--green); color:#fff;
  display:grid; place-items:center; font-size:8.5px; font-weight:800; letter-spacing:.2px;
}
.ai-reason{
  margin-top:9px; font-size:10.5px; line-height:1.7; color:#3E5A4C;
  background:rgba(255,255,255,.7); border-radius:9px; padding:9px 10px;
}
.ai-reason b{ color:var(--deep); }
.ai-alloc{ display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-top:10px; }
.alloc{ background:#fff; border-radius:9px; padding:8px 9px; text-align:center; }
.alloc .a-v{ font-family:var(--font-num); font-size:16px; font-weight:800; color:var(--deep); }
.alloc .a-k{ font-size:8.5px; color:var(--muted); margin-top:2px; letter-spacing:.2px; }
.ai-acts{ display:flex; gap:7px; margin-top:11px; }
.ai-acts .btn{ flex:1; height:36px; font-size:11.5px; border-radius:11px; padding:0 10px; }

.olist{ display:flex; flex-direction:column; gap:7px; }
.oitem{
  background:#fff; border-radius:12px; padding:10px 12px;
  display:flex; align-items:center; gap:10px;
  border:1px solid rgba(28,107,76,.05);
  box-shadow:0 1px 6px rgba(28,107,76,.04);
  transition:all .16s;
}

    if (!silent) { save(); if (SK.refresh) SK.refresh(); }
  };

  /* 自动演示时钟：每 5 秒推进一步（首页/追踪页可见） */
  let timer = null;
  SK.startClock = function () {
    if (timer) return;
    timer = setInterval(() => {
      state = store.s;
      const o = state.activeOrder;
      if (!o) return;
      if (!state.demo.autoPlay) return;
      if (o.status >= 5) return;
      state.demo.tick += 1;
      if (o.status >= 3 && o.status < 5) {
        o.temp = 62 + Math.min(2, Math.floor(state.demo.tick / 4));
      }
      if (state.demo.tick % 6 === 0) {
        SK.advanceOrder(o, true);
        save();
        if (SK.refreshSoft) SK.refreshSoft();
      }
    }, 1000);
  };

  /* ------------------------------ 调度中枢 ------------------------------ */

  SK.queueStats = function () {
    const q = state.queue;
    const pending = q.filter((x) => !x.assigned);
    const by = { full: 0, third: 0, vol: 0 };
    pending.forEach((x) => { by[x.route] = (by[x.route] || 0) + 1; });
    return {
      total: q.length,
      pending: pending.length,
      assigned: q.length - pending.length,
      full: by.full, third: by.third, vol: by.vol,
      urgent: pending.filter((x) => x.urgent).length
    };
  };

  SK.confirmAll = function () {
    const pending = state.queue.filter((x) => !x.assigned);
    if (!pending.length) return 0;
    pending.forEach((x) => { x.assigned = true; });
    state.aiDone = true;
    const s = SK.queueStats();
    state.ledger.forEach((l) => { if (l.st === '待派单') l.st = '配送中'; });

  };

  SK.reassignOne = function (id, route, reason) {

    x.assigned = false;
    x.reassigned = reason;

  };

  SK.routeName = (r) => ({ full: '专职养老配送', third: '第三方即时配送', vol: '网格员 / 志愿者' }[r] || r);

  SK.createException = function (orderId, who, addr, kind) {
    const n = state.exceptions.length + 1;
    const id = 'EX-09' + String(20 + n);
    const ex = {
      id, orderId: orderId || 'SK1123-0' + (60 + n), who, addr, kind,
      t: nowStr(), state: 'open', assignee: '—', result: '', act: '', span: '', over: true
    };
    state.exceptions.unshift(ex);
    const led = state.ledger.find((l) => l.id === ex.orderId);
    if (led) led.st = '异常挂起';
    if (state.activeOrder && state.activeOrder.id === ex.orderId) state.activeOrder.status = 4;
    SK.pushMsg('⚠️', '异常工单已生成', id + '：' + who + ' · ' + kind + '。补贴核销已挂起，等待网格员上门。', '异常', 'red');
    save();
    return ex;
  };

  SK.assignException = function (id) {
    const ex = state.exceptions.find((e) => e.id === id);
    if (!ex) return;
    ex.assignee = '王海 · 网格员（距老人 620m）';
    ex.state = 'assigned';
    ex.tAssigned = nowStr();
    SK.pushMsg('🏃', '异常工单已派给网格员', ex.id + ' 已指派王海，要求 10 分钟内上门。', '异常', 'red');
    save();
  };

  SK.closeException = function (id, result) {
    const ex = state.exceptions.find((e) => e.id === id);
    if (!ex) return;
    ex.state = 'closed';
    ex.result = result;
    ex.span = '7 分钟';
    ex.over = false;
    const rollback = result === '确认老人入院' || result === '确认老人外出';
    ex.act = rollback ? '订单撤单 · 补贴核销已回滚' : '已补送 · 补贴核销保留';
    const led = state.ledger.find((l) => l.id === ex.orderId);
    if (led) {
      led.st = rollback ? '已撤单（回滚）' : '已送达';
      led.visit = result;
    }
    if (state.activeOrder && state.activeOrder.id === ex.orderId) {
      state.activeOrder.status = 5;
      state.activeOrder.visit = { open: result, mood: '由网格员确认', need: rollback ? '订单已撤单' : '已补送', t: nowStr(), by: '王海 · 网格员' };
    }
    SK.pushMsg('✅', '异常已闭环', ex.id + '：' + result + '。' + ex.act + '。台账已标注原因码，24 小时内留痕。', '异常');
    save();
  };

  /* ------------------------------ 台账 / 看板 ------------------------------ */

  SK.ledgerTotals = function () {
    const L = state.ledger;
    const subsidy = L.reduce((a, b) => a + (b.subsidy || 0), 0);
    const self = L.reduce((a, b) => a + (b.self || 0), 0);
    const pay = L.reduce((a, b) => a + (b.pay || 0), 0);
    return { subsidy, self, pay, count: L.length };
  };

  SK.govNow = function () {
    const t = SK.ledgerTotals();
    const q = SK.queueStats();
    return {
      total: 300 + t.count,
      subsidy: 1800 + t.subsidy,
      dispatch: q.assigned,
      pending: q.pending,
      exceptions: state.exceptions.filter((e) => e.state !== 'closed').length,
      closed: state.exceptions.filter((e) => e.state === 'closed').length
    };
  };

  /* ------------------------------ 导出 ------------------------------ */

  SK.exportLedger = function () {
    const head = ['订单号', '时间', '老人', '餐品', '餐品原价', '民政补贴', '自费金额', '实付', '渠道', '状态', '送达温控(℃)', '回访结论'];
    const rows = state.ledger.map((l) => [
      l.id, l.time, l.who, l.meal, money(l.price), money(l.subsidy), money(l.self), money(l.pay),
      l.ch, l.st, l.temp == null ? '' : l.temp, l.visit
    ]);
    const csv = '\ufeff' + [head, ...rows].map((r) => r.map((c) => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\r\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '食刻_民政助餐台账_' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    SK.pushMsg('📄', '台账已导出', '补贴 / 自费双账目对清单已生成，包含温控与回访结论，可直接交民政核对。', '台账');
    save();
  };
})(window);
</script>

    const f = layer();
    const acts = (opts.actions || [{ t: '知道了' }]).map((a, i) =>
      '<button class="btn ' + (a.cls || (i === 0 ? '' : 'ghost')) + '" data-i="' + i + '">' + esc(a.t) + '</button>'
    ).join('');
    const wrap = SK.el('<div class="modal-wrap"><div class="modal">' +
      (opts.title ? '<h3>' + esc(opts.title) + '</h3>' : '') +
      (opts.html || ('<p>' + esc(opts.text || '') + '</p>')) +
      '<div class="m-actions">' + acts + '</div></div></div>');
    f.appendChild(wrap);
    wrap.addEventListener('click', (e) => {
      const b = e.target.closest('[data-i]');
      if (b) {
        const a = (opts.actions || [{}])[Number(b.dataset.i)];
        wrap.remove();
        if (a && a.fn) a.fn();
      }
      if (e.target === wrap && opts.dismiss !== false) wrap.remove();
    });
    return wrap;
  };

  SK.confirm = function (title, text, okTxt, cancelTxt) {
    return new Promise((res) => {
      SK.ui.modal({
        title, text,
        actions: [
          { t: okTxt || '确定', fn: () => res(true) },
          { t: cancelTxt || '取消', cls: 'ghost', fn: () => res(false) }
        ]
      });
    });
  };

  /* 底部动作列表 */
  SK.ui.actionSheet = function (title, items) {
    return new Promise((res) => {
      const f = layer();
      const wrap = SK.el('<div class="sheet-wrap"><div class="sheet">' +
        '<div class="sheet-head"><h3>' + esc(title) + '</h3>' +
        '<button class="x" data-close="1">' + SK.line('close', 15, 2) + '</button></div>' +
        '<div class="sheet-body">' + items.map((it, i) =>
          '<button class="mi" data-i="' + i + '" style="width:100%;text-align:left">' +
          '<span class="mi-ico">' + (it.ico || '•') + '</span>' +
          '<span class="mi-l">' + esc(it.t) + (it.s ? '<small>' + esc(it.s) + '</small>' : '') + '</span>' +
          '</button>').join('') +
        '</div></div></div>');
      f.appendChild(wrap);
      wrap.addEventListener('click', (e) => {
        const b = e.target.closest('[data-i]');
        if (b) {
          const i = Number(b.dataset.i);
          wrap.remove();
          res(items[i]);
        } else if (e.target === wrap || e.target.closest('[data-close]')) {
          wrap.remove();
          res(null);
        }
      });
    });
  };

  /* 语音播报（可降级） */
  SK.speak = function (text) {
    if (!SK.store.s.settings.voice) return;
    try {
      if (!w.speechSynthesis) return;
      w.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'zh-CN';
      u.rate = 0.9;
      w.speechSynthesis.speak(u);
    } catch (e) { /* ignore */ }
  };

  /* 事件委托 */
  SK.bind = function (root, sel, ev, fn) {
    root.addEventListener(ev, (e) => {
      const t = e.target.closest(sel);
      if (t && root.contains(t)) fn(e, t);
    });
  };
})(window);
</script>

      '<span class="mi-l">关于食刻<small>' + SK.BRAND.version + '</small></span>' +

      '<div class="center tiny" style="padding:16px 0 22px">' + SK.BRAND.org + '</div>' +
      '</div>' +
      SK.ui.tabbar('profile', s.unread);

  /* ============================== 补贴明细 ============================== */

  S.subsidy = function () {
    const s = SK.store.s;
    const used = s.quotaTotal - s.quotaLeft;
    const my = SK.myTierInfo();

  /* ============================== 订单追踪 ============================== */

  S.track = function (params) {
    const s = SK.store.s;

    if (!a) return S.orders();

    const cur = a.status;
    const steps = SK.STEPS;

      const done = i < cur, now = i === cur;
      let extra = '';

      if (i === 3 && (done || now)) extra = '距你 380m · 沿竹荫路直行';
      if (i === 4 && (done || now)) extra = a.visit ? '11:14 敲门 · ' + a.visit.open : '按「失能 + 需回访」执行敲门';

      '<div class="vg"><div class="k">是否开门</div><div class="v">' + esc(a.visit.open) + '</div></div>' +

      '<div class="th-status">' + esc(steps[cur].t).toUpperCase() + '</div>' +

      '<div class="tl">' + tl + '</div></div>' +

      SK.ui.topbar('纸质凭证') +

      '<div style="padding:0 var(--pad)"><div class="voucher">' +
      '<div class="vc-head"><span class="vh-t">食刻 · 助餐取餐凭证</span><span class="vh-n">' + esc(no) + '</span></div>' +
      '<div class="vc-line"></div>' +
      '<div class="vc-row"><span class="k">助餐点</span><span class="v">三里庵社区食堂 · 3 号窗口</span></div>' +
      '<div class="vc-row"><span class="k">取餐时段</span><span class="v">11:30 – 12:00</span></div>' +
      '<div class="vc-row"><span class="k">登记人</span><span class="v">王海 · 网格员</span></div>' +
      '<div class="vc-row"><span class="k">当餐菜品</span><span class="v">清蒸鲈鱼饭 · 软饭</span></div>' +
      '<div class="vc-row"><span class="k">忌口</span><span class="v">' + esc(voice) + '</span></div>' +
      '<div class="vc-row"><span class="k">份数 / 实付</span><span class="v">' + names.length + ' 份 · 每人 ¥8.00</span></div>' +
      '<div class="vc-line"></div>' +
      '<div class="vc-qr"><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAASIAAAEiAQMAAABncE31AAAABlBMVEUca0z////u7fzkAAABUUlEQVR42u2aOxLDIAxENeEAPpKvzpE4ADPEQh9wKqeQimQpnMCoepFWixwaD1YlRCHq16Ia6TpH549ynbcy7PTa1hc9WYj6Loom57nobI794O08bWAfy36mt7Cvlu3XlmsB7HPYs+bww8oA7HPZ09H1DOwz9X5rwQV6n8LefU5T0ZcHfE48+w/XebjRXGfgFcVeVV7aLLOfmiM6xG4T7MN7rWAXgfeGC/Y5eS8WR7K9q8WB5oSzZz85r1W35IfPSfA5lvxmNKt86/A5CT5nZfsao4nbhOaEa457Gu2wVgbI+3Cfc7bl9M1jqvwj7xPuVtpwJ2za77pgn3Cvdb1fk3zofdI8Z5Mbm2NC76P1fntvVWnPe/0pwCt4pmCvTbrXQoHPSWPvoxyx+8NvuOCVwd4qwCUIHjNN7/dJAjxmps9xpz/2EQPYJ/h7/JcMUX8S9QaYdcqGrRTozQAAAABJRU5ErkJggg==" alt="凭证二维码">' +
      '<div class="qr-t">扫码核销凭证<br>回写街道公示台账<br>计入志愿时长 <b>0.5 h</b></div></div>' +
      '<div class="vc-sign">' +
      '<div class="sig-box" id="sigBox"><span id="sigHint">请老人手写签收</span><canvas id="sigPad"></canvas></div>' +
      '<button class="btn sm" data-sigclear="1" style="align-self:flex-end">重签</button>' +
      '</div>' +
      '<div class="tiny mt8">领取人：' + esc(names.slice(0, 3).join('、')) + (names.length > 3 ? ' 等 ' + names.length + ' 位' : '') + '</div>' +
      '</div></div>' +

      '<div class="panel"><div class="panel-h"><span class="ph-dot"></span>同步到调度池</div>' +
      '<div class="payrow"><span class="p-l">订单渠道</span><span class="p-r"><span class="chip">线下通道 · 代登记</span></span></div>' +
      '<div class="payrow"><span class="p-l">调度池</span><span class="p-r">与线上订单同一池 · 统一半径校验</span></div>' +
      '<div class="payrow"><span class="p-l">台账回写</span><span class="p-r">当晚 20:00 前自动入账</span></div>' +
      '</div>' +
      '<div class="demo-tip">「窗帘之约」式的兜底：凭证丢失可凭身份证 + 楼栋名单核对放餐；回写遗漏次日 9:00 系统自动比对差异并提醒补录。</div>' +
      '<div style="height:16px"></div></div>' +

      '<div class="paybar"><div class="pb-l"><div class="pb-label">状态</div>' +
      '<div class="pb-amt"><span class="money" style="font-size:14px" id="sigState">待签收</span></div></div>' +
      '<button class="btn" data-sigdone="1">确认签收 · 完成</button></div>';
  };

  S.voucher.after = function (root) {
    const cv = SK.$('#sigPad', root);
    if (!cv) return;
    const box = SK.$('#sigBox', root);
    const hint = SK.$('#sigHint', root);
    const state = SK.store.s;
    state._signed = false;

    const resize = () => {
      const r = box.getBoundingClientRect();
      const dpr = Math.min(2, w.devicePixelRatio || 1);
      cv.width = Math.round(r.width * dpr);
      cv.height = Math.round(r.height * dpr);
      const ctx = cv.getContext('2d');
      ctx.scale(dpr, dpr);
      ctx.lineWidth = 2.2;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = '#1C6B4C';
    };
    resize();
    setTimeout(resize, 60);

    const ctx2 = () => cv.getContext('2d');
    let drawing = false;
    const pos = (e) => {
      const r = cv.getBoundingClientRect();
      const p = e.touches ? e.touches[0] : e;
      return { x: p.clientX - r.left, y: p.clientY - r.top };
    };
    const start = (e) => {
      drawing = true;
      if (hint) hint.style.display = 'none';
      state._signed = true;
      const el = SK.$('#sigState', root);
      if (el) { el.textContent = '已签收'; el.style.color = 'var(--green)'; }
      const p = pos(e);
      ctx2().beginPath();
      ctx2().moveTo(p.x, p.y);
      e.preventDefault();
    };
    const move = (e) => {
      if (!drawing) return;
      const p = pos(e);
      ctx2().lineTo(p.x, p.y);
      ctx2().stroke();
      e.preventDefault();
    };
    const end = () => { drawing = false; };

    cv.addEventListener('mousedown', start);
    cv.addEventListener('mousemove', move);
    w.addEventListener('mouseup', end);
    cv.addEventListener('touchstart', start, { passive: false });
    cv.addEventListener('touchmove', move, { passive: false });
    cv.addEventListener('touchend', end);

    SK.bind(root, '[data-sigclear]', 'click', () => {
      resize();
      state._signed = false;
      if (hint) hint.style.display = '';
      const el = SK.$('#sigState', root);
      if (el) { el.textContent = '待签收'; el.style.color = ''; }
    });

      '<div class="kpi ' + (gv.exceptions ? 'warn' : 'good') + '"><div class="k-v">' + gv.exceptions + '</div><div class="k-k">异常工单</div></div>' +
      '<div class="kpi good"><div class="k-v">100<small>%</small></div><div class="k-k">回访记录率</div></div>' +
      '</div>';

    let body = '';
    if (tab === 'dispatch') body = renderDispatch(s, st, extra, pendingTotal);
    if (tab === 'exception') body = renderException(s);
    if (tab === 'pool') body = renderPool();
    if (tab === 'ledger') body = renderLedger(s);

    return '<div class="screen ops" style="position:absolute;inset:0;display:flex;flex-direction:column">' +
      '<div class="ops-top">' +
      '<div class="ot-row"><div>' +
      '<div class="ot-brand">食刻 · 调度中枢</div>' +
      '<div class="ot-sub">' + SK.BRAND.street + ' · 助餐供需协同调度</div></div>' +
      '<span class="ot-tag">' + SK.dispatcher.name + ' · 调度员</span>' +
      '<span class="ot-live"><i></i>LIVE 11:0' + (new Date().getSeconds() % 10) + '</span>' +
      '</div>' + kpis + '</div>' +
      '<div class="ops-body">' + body + '</div>' +
      '<div class="opsnav">' + OPS_TABS.map((t) =>
        '<button class="' + (tab === t.k ? 'on' : '') + '" data-opstab="' + t.k + '">' +
        SK.icon(t.ico, 18) + '<span>' + t.n + '</span></button>').join('') +
      '<button data-go="home" style="opacity:.8">' + SK.icon('home', 17) + '<span>返回</span></button>' +
      '</div></div>';
  };

  /* —— 派单 —— */
  function renderDispatch(s, st, extra, pendingTotal) {

    return '<div class="ops-sec"><div class="ai-card">' +
      '<div class="ai-h"><span class="ai-dot">AI</span>智能体推荐方案' +

      '<div class="ai-reason">' +
      '当前 <b>' + pendingTotal + '</b> 单待派，三家食堂同时出餐。按「老人标签优先级 + 半径分层 + 运力水位」给出建议：' +
      '<b>专职队伍优先</b>（失能 / 需敲门回访 26 单），第三方补足 12 单，志愿者承接顺路探访 4 单；' +
      '边缘片区 <b>6 单合并为 1 条路线</b>集约配送。' +
      '</div>' +
      '<div class="ai-alloc">' +
      '<div class="alloc"><div class="a-v">26</div><div class="a-k">专职养老配送</div></div>' +
      '<div class="alloc"><div class="a-v">12</div><div class="a-k">第三方即时配送</div></div>' +
      '<div class="alloc"><div class="a-v">4</div><div class="a-k">网格员 / 志愿者</div></div>' +
      '</div>' +
      '<div class="ai-acts">' +
      '<button class="btn" data-confirmall="1" ' + (ai ? 'disabled' : '') + '>' + (ai ? '已下发 42 单' : '一键下发 42 单') + '</button>' +
      '<button class="btn ghost" data-go="poolhint" ' + (ai ? 'disabled' : '') + '>逐单确认</button>' +
      '</div>' +
      '<div class="tiny" style="margin-top:9px;color:#7A9186;line-height:1.6">关键约束（红线 6）：智能体只推荐，调度员拥有最终确认与改派权。</div>' +
      '</div></div>' +

      '<div class="ops-sec"><h4>待派列表<span class="n"> ' + pendingTotal + '</span>' +
      '<span class="r">展示前 ' + s.queue.length + ' 条 · 按优先级排序</span></h4>' +
      '<div class="olist">' + rows + '</div>' +
      '<div class="tiny" style="margin-top:8px;line-height:1.7;color:#8C9A92">' +
      '● 橙框为超时预警单（派单响应 &gt;15 分钟自动升级值班主管）　● 蓝色为第三方运力　● 橙色为志愿者顺路单</div>' +
      '</div>' +

      '<div class="ops-sec"><h4>改派留痕</h4>' +
      '<div class="ocard" style="font-size:10px;line-height:1.8;color:#516259">' +
      '每一次改派都会记录「操作人 / 时间 / 原因 / 原运力 → 新运力」，月底随台账一并交民政审计。<br>' +
      '<button class="btn ghost sm mt12" data-reassign="1">演示：改派 1 单并填写原因</button>' +
      '</div></div>' +
      '<div style="height:14px"></div>';
  }

  /* —— 异常 —— */
  function renderException(s) {
    const list = s.exceptions.map((ex) => {
      const cls = ex.state === 'closed' ? 'closed' : (ex.over ? 'overdue' : '');
      let acts = '';
      if (ex.state === 'open') {
        acts = '<div class="exc-acts"><button class="btn" data-assignexc="' + ex.id + '">指派最近网格员</button>' +
          '<button class="btn ghost" data-callfamily="' + ex.id + '">联系家属</button></div>';
      } else if (ex.state === 'assigned') {
        acts = '<div class="exc-acts"><button class="btn" data-closeexc="' + ex.id + '">记录上门结论</button>' +
          '<button class="btn ghost" data-callfamily="' + ex.id + '">联系家属</button></div>';
      } else {
        acts = '<div class="exc-acts"><button class="btn ghost" data-excdetail="' + ex.id + '">查看闭环记录</button></div>';

      return '<div class="exc ' + cls + '">' +
        '<div class="exc-h"><span class="ex-t">' + esc(ex.who) + ' · ' + esc(ex.kind) + '</span>' +

        acts + '</div>';

    return '<div class="ops-sec"><h4>异常工单中心<span class="r">SLA：10 分钟上门 · 24 小时闭环</span></h4>' +
      list +

      '<b>闭环链路：</b>骑手一键上报（照片/音频）→ 生成异常工单 → 按距离指派网格员 → 10 分钟内上门（开门 / 入院 / 外出 / 联系家属 四类结论）→ 撤单或补送 → <b>补贴核销回滚或重算</b> → 台账标注原因码。<br>' +
      '<span class="tiny">红线 4：任何异常必须在 24 小时内留有结论记录，否则台账无法关闭。</span>' +
      '</div>' +
      '<div style="height:14px"></div></div>';
  }

  /* —— 运力 —— */
  function renderPool() {
    return '<div class="ops-sec"><h4>运力池水位<span class="r">11:00 高峰</span></h4>' +
