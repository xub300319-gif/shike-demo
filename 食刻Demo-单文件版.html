      '③ 志愿者仅承接 1.5km 内顺路单并叠加探访任务，超负荷自动降级为纯探访；<br>' +
      '④ 极端天气 / 志愿者断供时，按预案整体切换第三方并留痕成本。' +
      '</div></div>' +

      '<div class="ops-sec"><h4>配送半径分层</h4>' +
      '<div class="ocard" style="font-size:10px;line-height:1.9;color:#516259">' +
      '<b>≤620m</b>　核心层 · 专职上门，承诺 25 分钟<br>' +
      '<b>620–1200m</b>　标准层 · 专职 + 第三方，承诺 40 分钟<br>' +
      '<b>1200–1500m</b>　边缘层 · 合并路线 + 集中取餐点，集约配送<br>' +
      '<b>&gt;1500m</b>　超半径 · 不安排上门，引导自取或预约流动餐车' +
      '</div></div>' +
      '<div style="height:14px"></div>';
  }

  /* —— 台账 —— */
  function renderLedger(s) {
    const t = SK.ledgerTotals();
    const tab = s.ledgerTab || 'all';
    let rows = s.ledger;
    if (tab === 'sub') rows = s.ledger.filter((l) => l.subsidy > 0);
    if (tab === 'self') rows = s.ledger.filter((l) => l.self > 0);

    return '<div class="ops-sec"><div class="dual">' +
      '<div class="d-card"><div class="d-k">补贴账（民政结算）</div><div class="d-v" style="color:var(--deep)">¥' + SK.money(t.subsidy) + '</div>' +
      '<div class="d-s">' + s.ledger.filter((l) => l.subsidy > 0).length + ' 单 · 按单核销</div></div>' +
      '<div class="d-card"><div class="d-k">自费账（商家分账）</div><div class="d-v" style="color:#B4551C">¥' + SK.money(t.self) + '</div>' +
      '<div class="d-s">' + s.ledger.filter((l) => l.self > 0).length + ' 单 · 明码标价</div></div>' +
      '</div>' +
      '<div class="flex gap6 mt12">' +
      ['all:全部', 'sub:补贴单', 'self:自费单'].map((x) => {
        const [k, n] = x.split(':');
        return '<button class="chip ' + (tab === k ? '' : 'grey') + '" data-ledgertab="' + k + '" style="height:26px;flex:1;justify-content:center">' + n + '</button>';
      }).join('') + '</div>' +

      '<div class="ltable mt12"><div class="lt-h"><span>订单 / 老人</span><span>补贴 / 自费</span><span>实付</span></div>' +
      rows.map((l) =>
        '<div class="lt-r"><div class="c1">' + esc(l.meal) + '<small>' + esc(l.id) + ' · ' + esc(l.who) + ' · ' + esc(l.time) + '</small></div>' +
        '<div class="c2">' + (l.subsidy > 0 ? '<span style="color:var(--green)">补 ¥' + SK.money(l.subsidy) + '</span>' : '<span style="color:#B4551C">自 ¥' + SK.money(l.self) + '</span>') +
        '<br><span style="font-size:8.5px;color:#8C9A92">' + esc(l.st) + '</span></div>' +
        '<div class="c3">¥' + SK.money(l.pay) + '</div></div>').join('') +
      '</div>' +

      '<div class="flex gap7 mt12">' +
      '<button class="btn soft" style="flex:1;height:38px;font-size:11.5px" data-export="1">' + SK.line('download', 15) + ' 导出台账 CSV</button>' +
      '<button class="btn ghost" style="flex:1;height:38px;font-size:11.5px" data-go="gov">民政看板</button></div>' +
      '<div class="tiny mt12" style="line-height:1.75;color:#8C9A92">' +
      '台账包含：订单、补贴分档、核销量、温控回传、回访结论、渠道（线上 / 线下代登记）、改派留痕。月末一键导出交民政，替代 Excel 两套系统。</div>' +
      '<div style="height:14px"></div></div>';
  }

  /* ============================== 民政看板 ============================== */

  S.gov = function () {
    const s = SK.store.s;
    const gv = SK.govNow();
    const max = Math.max.apply(null, SK.govStats.weeks.map((x) => x.v));
    const min = Math.min.apply(null, SK.govStats.weeks.map((x) => x.v));
    const bars = SK.govStats.weeks.map((x, i) =>
      '<div class="bar ' + (i === 4 ? 'today' : '') + '"><i style="height:' +
      (24 + Math.round(((x.v - min) / Math.max(1, max - min)) * 76)) + '%"></i><span>' + x.d + '</span></div>').join('');

    const pct = 98.7;
    const R = 26, C = 2 * Math.PI * R;

    return SK.ui.statusbar() +
      SK.ui.topbar('民政监管看板') +
      '<div class="body">' +
      '<div class="tiny" style="padding:0 var(--pad) 12px">' + SK.BRAND.street + ' · 助餐运营实况（演示数据）</div>' +

      '<div class="gov-kpis" style="padding:0 var(--pad)">' +
      '<div class="gk"><div class="gk-k">今日助餐总量</div><div class="gk-v">' + gv.total + '<small>份</small></div>' +
      '<div class="gk-d">较昨日 +4.6%</div></div>' +
      '<div class="gk"><div class="gk-k">补贴发放金额</div><div class="gk-v">¥' + Math.round(gv.subsidy) + '<small>元</small></div>' +
      '<div class="gk-d">补贴准确率 99.3%</div></div>' +
      '<div class="gk"><div class="gk-k">准时送达率</div><div class="gk-v">' + SK.govStats.deliverRate + '<small>%</small></div>' +
      '<div class="gk-d">承诺 ≤45 分钟</div></div>' +
      '<div class="gk"><div class="gk-k">餐温达标率</div><div class="gk-v">' + SK.govStats.tempRate + '<small>%</small></div>' +
      '<div class="gk-d">≥60℃ 保温箱回传</div></div>' +
      '<div class="gk"><div class="gk-k">半径合规率</div><div class="gk-v">100<small>%</small></div>' +
      '<div class="gk-d">超半径 0 单上门</div></div>' +
      '<div class="gk"><div class="gk-k">异常 24h 闭环</div><div class="gk-v">100<small>%</small></div>' +
      '<div class="gk-d">' + gv.closed + ' 单已闭环 / ' + gv.exceptions + ' 单处理中</div></div>' +
      '</div>' +

      '<div class="panel"><div class="panel-h"><span class="ph-dot"></span>近 7 日助餐量<span class="ph-r">份</span></div>' +
      '<div class="bars">' + bars + '</div></div>' +

      '<div class="panel"><div class="panel-h"><span class="ph-dot"></span>补贴核销审计</div>' +
      '<div class="gauge">' +
      '<div class="g-ring"><svg width="64" height="64"><circle cx="32" cy="32" r="' + R + '" stroke="#EDF3EE" stroke-width="7" fill="none"/>' +
      '<circle cx="32" cy="32" r="' + R + '" stroke="#27A76B" stroke-width="7" fill="none" stroke-linecap="round" ' +
      'stroke-dasharray="' + C + '" stroke-dashoffset="' + (C * (1 - pct / 100)) + '"/></svg>' +
      '<div class="g-txt">' + pct + '%</div></div>' +
      '<div class="g-main"><div class="g-t">补贴分档与核销量一致</div>' +
      '<div class="g-s">补贴单 / 自费单双轨建账 · 每笔可按单追溯<br>异常撤单已自动回滚核销</div></div>' +
      '</div></div>' +

      '<div class="panel"><div class="panel-h"><span class="ph-dot"></span>六条红线执行情况</div>' +
      [['不能简化为普通外卖点餐', '5 类运力路径全覆盖'],
       ['社会餐馆必须是重要供给', '签约 3 家 · 自费单 ' + s.ledger.filter((l) => l.self > 0).length + ' 笔'],
       ['运力不能只选一种', '专职 / 第三方 / 志愿 三路在用'],
       ['补贴梯度 + 闭合核销', '4 档梯度 · 核销率 99.3%'],
       ['保留线下代登记通道', '代登记订单 ' + s.ledger.filter((l) => l.ch.indexOf('线下') >= 0).length + ' 笔'],
       ['智能体只推荐、人工确认', '42 单全部经调度员确认']].map((r, i) =>
        '<div class="redline"><span class="rl-i">✓</span><span class="rl-t">' + (i + 1) + '. ' + esc(r[0]) + '</span>' +
        '<span class="rl-v">' + esc(r[1]) + '</span></div>').join('') +
      '</div>' +

      '<div class="panel"><div class="panel-h"><span class="ph-dot"></span>供给端水位</div>' +
      [['三里庵社区食堂（助餐点）', '产能 320/400 份', 80], ['街道中央厨房（央厨）', '产能 640/800 份', 80], ['签约社会餐馆 3 家', '可承接 90 单/日', 45]]
        .map((x) => '<div style="margin-bottom:11px"><div class="flex jcb" style="font-size:10.5px;margin-bottom:5px"><span>' + esc(x[0]) + '</span><span class="muted">' + esc(x[1]) + '</span></div>' +
          '<div class="p-bar" style="height:5px;border-radius:3px;background:#EDF3EE;overflow:hidden"><i style="display:block;height:100%;width:' + x[2] + '%;background:linear-gradient(90deg,#7FD3AA,#27A76B);border-radius:3px"></i></div></div>').join('') +
      '</div>' +

      '<div class="flex gap10" style="padding:0 var(--pad)">' +
      '<button class="btn soft" style="flex:1;height:42px;font-size:12px" data-export="1">导出台账</button>' +
      '<button class="btn ghost" style="flex:1;height:42px;font-size:12px" data-go="ops">进调度中枢</button></div>' +
      '<div class="center tiny" style="padding:14px 20px 20px">数据口径：街道助餐平台演示数据 · 仅用于答辩展示</div>' +
      '</div>';
  };
})(window);
</script>
<script>
/* ==== assets/app.js ==== */
/* ==========================================================================
   食刻 · 暖食一刻  |  app.js —— 路由、全局交互与启动
   ========================================================================== */
(function (w) {
  'use strict';
  const SK = w.SK;
  const esc = SK.esc;

  /* ------------------------------ 路由 ------------------------------ */

  const ROUTES = ['home', 'orders', 'messages', 'profile', 'order', 'meal', 'addrs',
    'pay', 'track', 'orderdetail', 'selfselect', 'subsidy', 'grid', 'voucher',
    'ops', 'gov', 'about'];

  let cur = { name: 'home', id: null };

  /* 每个页面的「上一级」——保证返回键永远有去处，绝不跳出 Demo */
  const PARENT = {
    home: 'home', orders: 'home', messages: 'home', profile: 'home',
    order: 'home', meal: 'order', addrs: 'meal', pay: 'meal',
    track: 'home', orderdetail: 'orders', selfselect: 'home',
    subsidy: 'home', grid: 'home', voucher: 'grid',
    ops: 'home', gov: 'profile', about: 'profile'
  };
  const ROOTS = ['home', 'orders', 'messages', 'profile'];

  /* 应用内导航栈：返回上一级用的是它，不依赖浏览器历史 */
  let stack = [];

  const hashOf = (r) => '#/' + r.name + (r.id ? '/' + r.id : '');
  const sameRoute = (a, b) => !!a && !!b && a.name === b.name && (a.id || null) === (b.id || null);

  const parseHash = () => {
    const h = String(location.hash || '').replace(/^#\/?/, '');
    if (!h) return { name: 'home', id: null };
    const parts = h.split('/');
    const name = ROUTES.indexOf(parts[0]) >= 0 ? parts[0] : 'home';
    return { name, id: parts[1] ? decodeURIComponent(parts[1]) : null };
  };

  SK.go = function (name, params) {
    if (name === 'poolhint') {
      SK.toast('演示版：可逐单点右侧运力标签改派');
      return;
    }
    if (ROUTES.indexOf(name) < 0) name = 'home';
    const r = { name, id: (params && params.id) || null };
    if (sameRoute(r, cur)) {
      if (location.hash !== hashOf(r)) location.hash = hashOf(r);
      else render(true);
      return;
    }
    if (ROOTS.indexOf(name) >= 0) stack = [r];   // 切换底部 Tab：栈重置
    else stack.push(r);
    if (location.hash === hashOf(r)) { cur = r; clearOverlays(); render(false); }
    else location.hash = hashOf(r);
  };

  /* 返回上一级：先退自己维护的栈，栈空则回预定义的上一级 */
  SK.back = function () {
    if (stack.length > 1) {
      stack.pop();
      const prev = stack[stack.length - 1];
      if (location.hash === hashOf(prev)) { cur = prev; clearOverlays(); render(true); }
      else location.hash = hashOf(prev);
      return;
    }
    const p = PARENT[cur.name] || 'home';
    if (p === cur.name) { SK.toast('已经是首页了'); return; }
    stack = [{ name: p, id: null }];
    if (location.hash === hashOf(stack[0])) { cur = stack[0]; clearOverlays(); render(false); }
    else location.hash = hashOf(stack[0]);
  };

  /* 关系路径：给「返回」按钮加个看得懂的上级名字 */
  const parentLabel = (n) => ({
    home: '首页', orders: '我的订单', messages: '消息', profile: '我的',
    order: '补贴套餐', meal: '套餐列表', addrs: '套餐详情', pay: '套餐详情',
    track: '首页', orderdetail: '我的订单', selfselect: '首页',
    subsidy: '首页', grid: '首页', voucher: '代登记',
    ops: '首页', gov: '我的', about: '我的'
  }[n] || '上一级');
  SK.backLabel = function () {
    const target = stack.length > 1 ? stack[stack.length - 2].name : (PARENT[cur.name] || 'home');
    return parentLabel(target);
  };

  const clearOverlays = () => {
    const f = SK.frame();
    SK.$$('.sheet-wrap,.modal-wrap,.toast', f).forEach((n) => n.remove());
  };

  function render(keep) {
    const app = SK.app();
    const prev = app.querySelector('.body') || app.querySelector('.ops-body');
    const st = prev ? prev.scrollTop : 0;
    const fn = SK.screens[cur.name] || SK.screens.home;
    const s = SK.store.s;
    app.classList.toggle('big', !!s.settings.big);
    app.innerHTML = fn({ id: cur.id }) || SK.screens.home({ id: cur.id });
    if (fn.after) fn.after(app, { id: cur.id });
    if (keep) {
      const nx = app.querySelector('.body') || app.querySelector('.ops-body');
      if (nx) nx.scrollTop = st;
    } else {
      const nx = app.querySelector('.body');
      if (nx) nx.scrollTop = 0;
    }
    SK.speak(s.settings.voice ? '' : '');
  }

  SK.refresh = function () { clearOverlays(); render(true); };
  SK.refreshSoft = function () { render(true); };

  w.addEventListener('hashchange', () => {
    const nx = parseHash();
    const n = stack.length;
    if (n === 0) {
      stack = [nx];
    } else if (sameRoute(nx, stack[n - 1])) {
      /* 由 SK.go / SK.back 触发，栈已同步 */
    } else if (n >= 2 && sameRoute(nx, stack[n - 2])) {
      stack.pop();
    } else {
      const idx = stack.findIndex((r) => sameRoute(r, nx));
      if (idx >= 0) stack = stack.slice(0, idx + 1);
      else stack.push(nx);
    }
    cur = nx;
    clearOverlays();
    render(false);
  });

  /* 手机边缘右滑 → 返回上一级（老人更容易发现的手势） */
  (function edgeSwipe() {
    let sx = 0, sy = 0, active = false;
    const app = () => SK.app();
    document.addEventListener('touchstart', (e) => {
      const t = e.touches[0];
      active = t.clientX <= 28;
      if (active) { sx = t.clientX; sy = t.clientY; }
    }, { passive: true });
    document.addEventListener('touchend', (e) => {
      if (!active) return;
      active = false;
      const t = e.changedTouches[0];
      const dx = t.clientX - sx, dy = Math.abs(t.clientY - sy);
      if (dx > 62 && dy < 55 && app().contains(e.target)) SK.back();
    }, { passive: true });
  })();

  /* ------------------------------ 交互 ------------------------------ */

  const D = () => SK.draft;

  function applySetting(key) {
    const s = SK.store.s;
    s.settings[key] = !s.settings[key];
    SK.commit(false);
  }

  function boot() {
    SK.store.init();
    cur = parseHash();
    render(false);
    SK.startClock();

    const sp = document.getElementById('splash');
    if (sp) setTimeout(() => { sp.classList.add('gone'); setTimeout(() => sp.remove(), 600); }, 1150);
  }

  /* 全局委托 */
  document.addEventListener('click', (e) => {
    const app = SK.app();

    /* —— 导航 —— */
    const g = e.target.closest('[data-go]');
    if (g && app.contains(g)) {
      const to = g.dataset.go;
      const id = g.dataset.id || null;
      if (to === 'track' && !SK.store.s.activeOrder) { SK.toast('当前没有进行中的订单'); return; }
      SK.go(to, id ? { id } : null);
      return;
    }
    if (e.target.closest('[data-back]')) { SK.back(); return; }

    if (!app.contains(e.target) && !e.target.closest('.sheet-wrap,.modal-wrap')) return;

    const t = (sel) => e.target.closest(sel);

    /* —— 下单 —— */
    const buy = t('[data-buy]');
    if (buy) {
      D().mealId = buy.dataset.buy;
      D().qty = 1;
      SK.go('meal', { id: D().mealId });
      return;
    }

    const dr = t('[data-draft]');
    if (dr) {
      const [k, v] = dr.dataset.draft.split(':');
      if (k === 'soft') D().soft = v;
      else D()[k] = !D()[k];
      SK.refresh();
      return;
    }

    const al = t('[data-al]');
    if (al) {
      const a = al.dataset.al;
      const i = D().allergy.indexOf(a);
      if (i >= 0) D().allergy.splice(i, 1); else D().allergy.push(a);
      SK.refresh();
      return;
    }

    const tm = t('[data-time]');
    if (tm) { D().timeIdx = Number(tm.dataset.time); SK.refresh(); return; }

    const q = t('[data-qty]');
    if (q) {
      D().qty = Math.max(1, D().qty + Number(q.dataset.qty));
      SK.refresh();
      return;
    }

    const pa = t('[data-pickaddr]');
    if (pa) {
      D().addrId = pa.dataset.pickaddr;
      const a = SK.addresses.find((x) => x.id === D().addrId);
      const chk = SK.checkAddr(a);
      if (!chk.ok) { SK.toast('该地址超出上门半径，可改为到点自取'); }
      SK.back();
      return;
    }

    if (t('[data-confirm-order]')) {
      const a = SK.addresses.find((x) => x.id === D().addrId) || SK.addresses[0];
      const chk = SK.checkAddr(a);
      if (!chk.ok) {
        SK.ui.modal({
          title: '超出配送半径',
          text: '「' + a.name + '」距离助餐点超过 ' + chk.R + ' 米，无法安排上门配送。建议改用社区活动室集中取餐点自取，或预约流动餐车。',
          actions: [{ t: '去选地址', fn: () => SK.go('addrs') }, { t: '知道了', cls: 'ghost' }]
        });
        return;
      }
      SK.go('pay');
      return;
    }

    const pm = t('[data-pay]');
    if (pm) { D().payMethod = pm.dataset.pay; SK.refresh(); return; }

    if (t('[data-dopay]')) {
      const btn = t('[data-dopay]');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';
      setTimeout(() => {
        const o = SK.placeOrder({
          mealId: D().mealId, qty: D().qty, soft: D().soft,
          lessSalt: D().lessSalt, lessOil: D().lessOil,
          allergy: D().allergy.slice(), note: D().note,
          knock: D().knock, addrId: D().addrId, payMethod: D().payMethod
        });
        SK.toast('支付成功 · 已抵扣 ¥' + SK.money(o.subsidy), '✅');
        SK.speak('下单成功，' + o.mealName.replace('补贴套餐 · ', '') + '，实付' + SK.money(o.pay) + '元');
        SK.go('track');
      }, 620);
      return;
    }

    /* —— 追踪 / 演示 —— */
    if (t('[data-advance]')) {
      SK.advanceOrder(SK.store.s.activeOrder);
      SK.refresh();
      return;
    }

    if (t('[data-simexc]')) {
      SK.ui.modal({
        title: '骑手端一键上报',
        text: '李师傅：敲了 3 次门，屋里没人应答，电话也没人接。已拍门口照片。是否上报异常？',
        actions: [
          {
            t: '上报异常',
            fn: () => {
              const a = SK.store.s.activeOrder;
              const ex = SK.createException(a.id, SK.elder.name, a.addr, '敲门 3 次无人应答');
              SK.store.s.opsTab = 'exception';
              SK.toast('异常工单 ' + ex.id + ' 已生成', '⚠️');
              SK.go('ops');
            }
          },
          { t: '再等 5 分钟', cls: 'ghost' }
        ]
      });
      return;
    }

    if (t('[data-call]')) { SK.toast('正在呼叫骑手 156****8820'); return; }

    /* —— 自费 —— */
    const ad = t('[data-add]');
    if (ad) { SK.addDish(ad.dataset.add); return; }
    const sb = t('[data-sub]');
    if (sb) { SK.subDish(sb.dataset.sub); return; }
    if (t('[data-cart]')) { SK.openCart(); return; }
    if (t('[data-doself]')) {
      const id = SK.placeSelfOrder(D().payMethod);
      if (id) {
        SK.toast('自费订单已提交 · 40 分钟内送达');
        SK.go('orders');
      }
      return;
    }

    /* —— 列表 / 设置 —— */
    const ot = t('[data-otab]');
    if (ot) { SK.store.s.orderTab = ot.dataset.otab; SK.commit(); return; }

    const mg = t('[data-msg]');
    if (mg) {
      const m = SK.store.s.messages.find((x) => x.id === mg.dataset.msg);
      if (m) { m.unread = false; SK.store.s.unread = SK.store.s.messages.filter((x) => x.unread).length; SK.commit(); }
      return;
    }
    if (t('[data-readall]')) {
      SK.store.s.messages.forEach((m) => { m.unread = false; });
      SK.store.s.unread = 0;
      SK.commit();
      SK.toast('已全部标为已读');
      return;
    }

    const st = t('[data-set]');
    if (st) { applySetting(st.dataset.set); return; }

    if (t('[data-reset]')) {
      SK.confirm('重置演示数据？', '会清空本次演示产生的订单、工单与消息，恢复到高保真稿的初始状态。', '重置', '取消')
        .then((ok) => { if (ok) { SK.store.reset(); SK.go('home'); SK.toast('已重置演示数据'); } });
      return;
    }

    const ro = t('[data-reorder]');
    if (ro) {
      const s = SK.store.s;
      const o = s.orders.find((x) => x.id === ro.dataset.reorder);
      const m = o && SK.meals.find((x) => o.mealName.indexOf(x.name) >= 0);
      if (m) { D().mealId = m.id; SK.go('meal', { id: m.id }); }
      else SK.go('order');
      return;
    }

    /* —— 网格员代登记 —— */
    const gs = t('[data-gridsel]');
    if (gs) {
      const s = SK.store.s;
      const id = gs.dataset.gridsel;
      const i = s.gridSel.indexOf(id);
      if (i >= 0) s.gridSel.splice(i, 1); else s.gridSel.push(id);
      SK.commit();
      return;
    }
    if (t('[data-gridall]')) {
      const s = SK.store.s;
      s.gridSel = s.gridSel.length === SK.gridElders.length ? [] : SK.gridElders.map((x) => x.id);
      SK.commit();
      return;
    }
    if (t('[data-gridmake]')) {
      const s = SK.store.s;
      if (!s.gridSel.length) { SK.toast('请先选择老人'); return; }
      const elders = SK.gridElders.filter((x) => s.gridSel.indexOf(x.id) >= 0);
      s.gridBatch = {
        no: 'ZP' + new Date().toISOString().slice(0, 10).replace(/-/g, '') + '-00' + elders.length,
        elders, voice: s.gridVoice || '少盐、软食，不吃辣'
      };
      s.queue.unshift({
        id: s.gridBatch.no, who: elders[0].name + ' 等 ' + elders.length + ' 位',
        addr: elders[0].addr, dist: 620, tags: ['线下通道', '代登记', '敲门回访'],
        meal: '清蒸鲈鱼饭 ×' + elders.length, route: 'vol', urgent: 0, assigned: false
      });
      SK.pushMsg('📝', '网格员代登记 ' + elders.length + ' 单', '王海代登记 ' + elders.length + ' 位老人，已生成纸质凭证 ' + s.gridBatch.no + '，等待手写签收。', '代登记');
      SK.commit(false);
      SK.go('voucher');
      return;
    }
    if (t('[data-sigdone]')) {
      const s = SK.store.s;
      if (!s._signed) { SK.toast('请先请老人手写签收'); return; }
      const n = s.gridBatch ? s.gridBatch.elders.length : 6;
      SK.gridWorker.hours += 0.5;
      SK.pushMsg('✅', '纸质凭证已回写台账', n + ' 位老人完成签收，凭证已计入街道公示台账；志愿时长 +0.5h。', '台账');
      s.gridVoice = '';
      s.gridBatch = null;
      s._signed = false;
      SK.commit(false);
      SK.ui.modal({
        title: '签收完成 · 已回写台账',
        text: n + ' 位老人的取餐凭证已核销，志愿时长 +0.5h。当晚 20:00 前同步到台账，可计入志愿时长认定。',
        actions: [{ t: '返回代登记', fn: () => SK.go('grid') }, { t: '回首页', cls: 'ghost', fn: () => SK.go('home') }]
      });
      return;
    }

    /* —— 调度中枢 —— */
    const op = t('[data-opstab]');
    if (op) { SK.store.s.opsTab = op.dataset.opstab; SK.commit(); return; }

    if (t('[data-confirmall]')) {
      const n = SK.confirmAll();
      SK.toast('已下发 42 单 · 派单响应 ≤20 分钟', '📤');
      SK.refresh();
      return;
    }

    if (t('[data-reassign]')) {
      const s = SK.store.s;
      const pend = s.queue.filter((x) => !x.assigned);
      if (!pend.length) { SK.toast('没有待改派的订单'); return; }
      SK.ui.actionSheet('选择要改派的订单', pend.slice(0, 6).map((x) => ({
        t: x.who + ' · ' + x.meal, s: x.id + ' · ' + x.addr + ' · ' + x.dist + 'm', ico: '📦'
      }))).then((pick) => {
        if (!pick) return;
        const target = pend.slice(0, 6).find((x) => pick.t.indexOf(x.who) === 0);
        SK.ui.actionSheet('改派至哪一路运力', [
          { t: '专职养老配送', s: '适合失能 / 需敲门回访', ico: '🛵' },
          { t: '第三方即时配送', s: '适合边缘片区 / 高峰回补', ico: '🚚' },
          { t: '网格员 / 志愿者', s: '顺路单 + 探访任务', ico: '🏃' }
        ]).then((r2) => {
          if (!r2) return;
          const map = { '专职养老配送': 'full', '第三方即时配送': 'third', '网格员 / 志愿者': 'vol' };
          SK.ui.actionSheet('改派原因（留痕用）', [
            { t: '专职水位已满', ico: '💧' }, { t: '老人临时改约时间', ico: '🕒' },
            { t: '地址修正 / 楼栋变更', ico: '🏠' }, { t: '志愿者超负荷，降级为探访', ico: '⚠️' }
          ]).then((r3) => {
            if (!r3) return;
            SK.reassignOne(target.id, map[r2.t], r3.t);
            SK.toast('已改派 ' + target.id + ' → ' + r2.t);
            SK.refresh();
          });
        });
      });
      return;
    }

    const ae = t('[data-assignexc]');
    if (ae) {
      SK.assignException(ae.dataset.assignexc);
      SK.toast('已指派王海 · 要求 10 分钟内上门');
      SK.refresh();
      return;
    }

    const ce = t('[data-closeexc]');
    if (ce) {
      SK.ui.actionSheet('网格员上门结论', [
        { t: '开门 · 状态正常', s: '订单保留，正常送达', ico: '✅' },
        { t: '确认老人入院', s: '撤单并回滚补贴核销', ico: '🏥' },
        { t: '确认老人外出', s: '餐留取餐点保温柜 + 电话留条', ico: '🚶' },
        { t: '联系家属代为确认', s: '由家属决定撤单或补送', ico: '📞' }
      ]).then((r) => {
        if (!r) return;
        const txt = r.t.indexOf('开门') === 0 ? '老人开门 · 状态正常'
          : r.t.indexOf('入院') > -1 ? '确认老人入院'
          : r.t.indexOf('外出') > -1 ? '确认老人外出' : '联系家属代为确认';
        SK.closeException(ce.dataset.closeexc, txt);
        SK.toast('异常已闭环 · 补贴核销已处理');
        SK.refresh();
      });
      return;
    }

    const ed = t('[data-excdetail]');
    if (ed) {
      const ex = SK.store.s.exceptions.find((x) => x.id === ed.dataset.excdetail);
      if (ex) {
        SK.ui.modal({
          title: ex.id + ' · 闭环记录',
          text: '老人：' + ex.who + '\n结论：' + ex.result + '\n处理：' + ex.act + '\n耗时：' + ex.span +
            '\n\n24 小时内已留结论记录，台账可关闭。补贴核销与撤单动作均已写入审计日志。',
          actions: [{ t: '知道了' }]
        });
      }
      return;
    }

    if (t('[data-callfamily]')) { SK.toast('正在呼叫家属 136****9027'); return; }

    const lt = t('[data-ledgertab]');
    if (lt) { SK.store.s.ledgerTab = lt.dataset.ledgertab; SK.commit(); return; }

    if (t('[data-export]')) {
      SK.exportLedger();
      SK.toast('台账已导出为 CSV', '📄');
      return;
    }
  });

  /* 备注输入 */
  document.addEventListener('input', (e) => {
    if (e.target.matches('[data-note]')) {
      SK.draft.note = e.target.value;
    }
  });

  /* 网格员语音按钮 */
  document.addEventListener('click', (e) => {
    const vb = e.target.closest('#voiceBtn');
    if (!vb) return;
    const res = document.getElementById('voiceRes');
    if (!res || vb.dataset.rec) return;
    vb.dataset.rec = '1';
    vb.classList.add('rec');
    res.innerHTML = '<span style="color:#8C9A92">正在聆听…</span><span class="blink"></span>';
    const full = '钱秀兰的邻居张桂芳，少盐、软食，不吃辣，每天中午十一点半前送到。';
    let i = 0;
    const timer = setInterval(() => {
      i += 2;
      res.innerHTML = '<span class="vw">' + SK.esc(full.slice(0, i)) + '</span><span class="blink"></span>';
      if (i >= full.length) {
        clearInterval(timer);
        setTimeout(() => {
          vb.classList.remove('rec');
          delete vb.dataset.rec;
          SK.store.s.gridVoice = full;
          SK.commit(false);
          res.innerHTML = '<span class="vw">' + SK.esc(full) + '</span>';
          const t = document.querySelector('.voice .v-t');
          if (t) t.textContent = '已识别，可继续补充或直接生成凭证';
          SK.toast('语音已转文字 · 忌口标签已提取：「少盐、软食、不吃辣」');
        }, 320);
      }
    }, 42);
  });

  /* 启动 */
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(window);

</script>
</body>
</html>
